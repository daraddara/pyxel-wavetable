[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxel-wavetable"
version = "0.1.0"
description = "Small waveform generators returning ordinary Pyxel Tones"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyxel>=2.9.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
