[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxel-wavetable"
version = "0.1.0"
description = "Small waveform generators returning ordinary Pyxel Tones"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["pyxel", "wavetable", "synthesis", "audio", "chiptune"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = ["pyxel>=2.9.9,<3"]

[project.urls]
Repository = "https://github.com/daraddara/pyxel-wavetable"
Documentation = "https://github.com/daraddara/pyxel-wavetable/blob/main/docs/tone-lab.md"
Issues = "https://github.com/daraddara/pyxel-wavetable/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
