name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG_VERSION"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag}")

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if tag[1:] != version:
              raise SystemExit(f"tag {tag} does not match pyproject version {version}")

          print(f"release version: {version}")
          PY

      - name: Install test and build dependencies
        run: python -m pip install -e ".[test]" build twine

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --title "${{ github.ref_name }}"
